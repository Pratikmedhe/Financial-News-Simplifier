<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial News Simplifier</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero">
    <div class="hero-content">
        <h1>Financial News Simplifier</h1>
        <p>Understand financial news in simple language.</p>
    </div>
    <div class="finance-graphic">
    <div class="chart-line"></div>
    <div class="chart-bar bar-one"></div>
    <div class="chart-bar bar-two"></div>
    <div class="chart-bar bar-three"></div>
    <div class="chart-bar bar-four"></div>
    </div>
    </div>



    <p>
        Understand financial news in simple language.
    </p>
    <button id="refresh-button" onclick="loadNews()">
        Refresh News
    </button>

    <h2 class="section-title">Latest Financial News</h2>
    <p id="news-count">Loading articles...</p>
    <div id="news-container">
        <p>Loading financial news...</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
